name: Notify Telegram on Merge to Dev

on:
  push:
    branches:
      - dev

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get Last Commit from Merged Branch
        id: get_commit
        run: |
          # Get the SHA of the commit before the merge commit
          PARENT_SHA=$(git rev-parse HEAD~2)
          
          # Get the last commit message from the branch that was merged
          COMMIT_MESSAGE=$(git log -1 --format=%B ${PARENT_SHA})
          
          echo "Commit Message: ${COMMIT_MESSAGE}"
          echo "::set-output name=commit_message::${COMMIT_MESSAGE}"

      - name: Send Telegram Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="🚀 *New Merge to dev in ${GITHUB_REPOSITORY}!*  
          
          🔹 **Merged By**: ${GITHUB_ACTOR}  
          🔹 **Commit Message**: ${{ steps.get_commit.outputs.commit_message }}
          🔹 **Commit Hash**: ${GITHUB_SHA}  

          🔗 [View Repository](https://github.com/${GITHUB_REPOSITORY}/tree/dev)"

          curl -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
               -d "chat_id=${TELEGRAM_CHAT_ID}" \
               -d "text=${MESSAGE}" \
               -d "parse_mode=Markdown"
