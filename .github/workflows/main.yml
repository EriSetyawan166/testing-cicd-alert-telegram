name: Notify Telegram on Merge to Dev

on:
  push:
    branches:
      - dev

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Get Latest Commit Message
        id: get_commit
        run: |
          LAST_COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          echo "commit_message=$LAST_COMMIT_MESSAGE" >> $GITHUB_ENV

      - name: Send Telegram Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE="🚀 *New Merge to dev in ${GITHUB_REPOSITORY}!*  
          
          🔹 **Merged By**: ${GITHUB_ACTOR}  
          🔹 **Commit Message**: ${commit_message}
          🔹 **Commit Hash**: ${GITHUB_SHA}  

          🔗 [View Repository](https://github.com/${GITHUB_REPOSITORY}/tree/dev)"

          curl -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
               -d "chat_id=${TELEGRAM_CHAT_ID}" \
               -d "text=${MESSAGE}" \
               -d "parse_mode=Markdown"
